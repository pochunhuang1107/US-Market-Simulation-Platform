name: test

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_simulator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d market_simulator_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/market_simulator_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Install attempt ${attempt}..."
            python -m pip install --progress-bar off -e ".[dev]" && break
            if [ "${attempt}" -eq 3 ]; then
              echo "Dependency installation failed after 3 attempts."
              exit 1
            fi
            echo "Install failed. Retrying in 5 seconds..."
            sleep 5
          done

      - name: Wait for Postgres
        run: |
          python - <<'PY'
          import socket
          import time

          host = "127.0.0.1"
          port = 5432

          for _ in range(60):
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print("Postgres is ready")
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("Postgres did not become ready in time")
          PY

      - name: Run tests
        run: |
          pytest

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        run: |
          npm run build
